name: migration-kit-ci

on:
  pull_request:
  push:
    branches:
      - main
      - feat/initial-migration-kit

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run dependency-free regression fixtures
        run: npm test
